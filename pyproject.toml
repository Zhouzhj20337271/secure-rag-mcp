[project]
name = "secure-rag-mcp"
version = "0.1.0"
description = "Local secure hybrid retrieval service exposed through MCP"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mcp[cli]==2.3.0",
    "pyyaml>=6.0.2,<7",
    "qdrant-client[fastembed]==1.16.1",
]

[project.scripts]
secure-rag-ingest = "secure_rag.ingestion:main"
secure-rag-eval = "secure_rag.evaluation:main"
secure-rag-search = "secure_rag.cli:main"
secure-rag-server = "secure_rag.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/secure_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

